name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Failed to detect Java version!"
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Active Java version $JAVA_MAJOR is lower than 17!"
            exit 1
          fi
          echo "Active Java major version is $JAVA_MAJOR (verified >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Failed to create debug keystore!"
            exit 1
          fi
          echo "Temporary debug keystore verified at ./debug.keystore"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Expected debug APK not found at $EXPECTED_APK!"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -type f || true
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Debug APK file exists but is empty!"
            exit 1
          fi
          echo "Verified debug APK exists and is non-empty at $EXPECTED_APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/_/g')
          RUN_NUM="${{ github.run_number }}"
          ASSET_NAME="${REPO_NAME}-debug-build-${RUN_NUM}.apk"
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "${TMP_DIR}/${ASSET_NAME}"
          echo "asset_path=${TMP_DIR}/${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "Prepared release asset at ${TMP_DIR}/${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Prepared release asset not found!"
            exit 1
          fi
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "This is an automatically generated debug APK built by GitHub Actions.
          
          - Run Number: #${{ github.run_number }}
          - Run Attempt: #${{ github.run_attempt }}
          - Commit SHA: ${{ github.sha }}
          
          This APK is intended for testing and is signed with a temporary debug keystore."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" == "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            TITLE="Debug APK Build #${{ github.run_number }}"
            echo "### 🚀 Debug APK Published Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "**Release Title:** $TITLE" >> $GITHUB_STEP_SUMMARY
            echo "**Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "The APK is available for direct download under the release Assets section on GitHub, as well as via the \`app-debug-apk\` Actions artifact." >> $GITHUB_STEP_SUMMARY
            gh release view "$TAG_NAME" || true
          else
            echo "### ⚠️ Release Publishing Notice" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK build and verification succeeded! The GitHub Actions artifact named \`app-debug-apk\` is available for download in the workflow run summary." >> $GITHUB_STEP_SUMMARY
          fi
